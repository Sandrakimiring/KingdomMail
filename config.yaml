# Phase 1: info@ mailboxes only.
# Once approved, the rest (personal/named mailboxes) get added the same way.
# Passwords go in .env, never here.
#
# The mail server is shared hosting: its TLS certificate is issued for
# *.web-hosting.com, not for mail.<domain>. Connecting by the server
# hostname below is what lets the certificate be verified properly.
# cPanel shows this name under Email Accounts > Connect Devices >
# Secure SSL Settings. If the account is moved to another server, update it here.

mailboxes:
  - company: "Balcom Solutions"
    email: "info@balcom.solutions"
    imap_host: "business61-1.web-hosting.com"
    imap_port: 993
    password_env: "BALCOM_INFO_PASSWORD"
    mode: "all"

